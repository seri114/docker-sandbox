name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  docker-test:
    name: Docker-based Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build sandbox image
        run: |
          docker build -t sandbox:latest -f sandbox-controller/docker/Dockerfile .

      - name: Download dependencies
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            sandbox:latest \
            sh -c "cd /app && go mod download"

      - name: Run go vet
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            sandbox:latest \
            sh -c "cd /app && go vet ./..."

      - name: Run go fmt check
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            sandbox:latest \
            sh -c "cd /app && if [ -n \"\$(gofmt -l .)\" ]; then echo 'Go code is not formatted:'; gofmt -d .; exit 1; fi"

      - name: Run unit tests
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e CGO_ENABLED=1 \
            sandbox:latest \
            sh -c "cd /app && go test -v -race ./..."

      - name: Run integration tests
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run Integration ./..."

      - name: Run E2E tests
        run: |
          docker run --rm \
            -v $(pwd)/sandbox-controller:/app \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run E2E ./..."

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pip install uv

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
