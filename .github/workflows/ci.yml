name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  docker-test:
    name: Docker-based Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build sandbox builder image
        run: |
          docker build \
            --target builder \
            --build-arg SOURCE_DIR=. \
            -t sandbox:latest \
            -f sandbox-controller/docker/Dockerfile \
            .

      - name: Build sandbox runtime image
        run: |
          docker build --target runtime -t sandbox:runtime -f sandbox-controller/docker/Dockerfile .

      - name: Download dependencies
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && go mod download"

      - name: Run go vet
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && go vet ./..."

      - name: Run go fmt check
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && if [ -n \"\$(gofmt -l .)\" ]; then echo 'Go code is not formatted:'; gofmt -d .; exit 1; fi"

      - name: Run unit tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e CGO_ENABLED=1 \
            sandbox:latest \
            sh -c "cd /app && go test -v -race ./..."

      - name: Run integration tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run Integration ./..."

      - name: Run E2E tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run E2E ./..."

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pip install uv

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
