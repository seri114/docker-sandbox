name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  docker-test:
    name: Docker-based Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build sandbox builder image
        run: |
          docker build \
            --target builder \
            --build-arg SOURCE_DIR=. \
            -t sandbox:latest \
            -f sandbox-controller/docker/Dockerfile \
            .

      - name: Build sandbox runtime image
        run: |
          docker build --target runtime -t sandbox:runtime -f sandbox-controller/docker/Dockerfile .

      - name: Download dependencies
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && go mod download"

      - name: Run go vet
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && go vet ./..."

      - name: Run go fmt check
        run: |
          docker run --rm \
            sandbox:latest \
            sh -c "cd /app && if [ -n \"\$(gofmt -l .)\" ]; then echo 'Go code is not formatted:'; gofmt -d .; exit 1; fi"

      - name: Run unit tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            -e CGO_ENABLED=1 \
            sandbox:latest \
            sh -c "cd /app && go test -v -race ./..."

      - name: Run integration tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run Integration ./..."

      - name: Run E2E tests
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKER_HOST=unix:///var/run/docker.sock \
            sandbox:latest \
            sh -c "cd /app && go test -v -run E2E ./..."

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pip install uv

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
