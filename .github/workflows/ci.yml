name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  security-events: write

jobs:
  go-test:
    name: Go Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.26']

    services:
      docker:
        image: docker:dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
        options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Pull Docker images
        run: |
          docker pull alpine:latest
          docker pull python:3.14-alpine

      - name: Download dependencies
        working-directory: ./sandbox-controller
        run: go mod download

      - name: Run go vet
        working-directory: ./sandbox-controller
        run: go vet ./...

      - name: Run go fmt check
        working-directory: ./sandbox-controller
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Go code is not formatted:"
            gofmt -d .
            exit 1
          fi

      - name: Run unit tests
        working-directory: ./sandbox-controller
        run: go test -v -race ./...

  pre-commit:
    name: Pre-commit Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.14'

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pip install uv

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [go-test]

    services:
      docker:
        image: docker:dind@sha256:6b9cd914eb9c6b342c040a49a27a5eb3804453bae6ecc90f7ff96133595a95e8
        options: --privileged

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: '1.26'

      - name: Pull Docker images
        run: |
          docker pull alpine:latest
          docker pull python:3.14-alpine

      - name: Run Go integration tests
        working-directory: ./sandbox-controller
        run: go test -v -run Integration ./...

      - name: Run E2E tests
        working-directory: ./sandbox-controller
        run: go test -v -run E2E ./...

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
