# Pre-commit hooks for code quality
# Install: uv pip install pre-commit
# Setup: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Go formatting and linting
  - repo: local
    hooks:
      - id: gofmt
        name: gofmt
        entry: bash -c 'cd sandbox-controller && gofmt -w -l .'  # shell: true equivalent
        language: system
        files: ^sandbox-controller/.*\.go$
        pass_filenames: false

      - id: go-vet
        name: go vet
        entry: bash -c 'cd sandbox-controller && go vet ./...'
        language: system
        files: ^sandbox-controller/.*\.go$
        pass_filenames: false

  # Python formatting and linting (ruff)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
        files: ^webui/.*\.py$

      - id: ruff-format
        files: ^webui/.*\.py$

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: cef0300fd0fc4d2a87a85fa2093c6b283ea36f4b  # v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^webui/.*\.(min\.)?(js|css)$

      - id: end-of-file-fixer
        exclude: ^webui/.*\.(min\.)?(js|css)$

      - id: check-yaml
        files: \.ya?ml$

      - id: check-json
        files: \.json$

      - id: check-added-large-files
        args: ['--maxkb=1000']

      - id: check-merge-conflict
