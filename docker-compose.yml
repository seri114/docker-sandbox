services:
  nginx:
    image: nginx:alpine
    ports:
      - "${WEB_UI_PORT:-8080}:80"
    volumes:
      - ./webui:/usr/share/nginx/html:ro
    networks:
      - sandbox-net
    restart: unless-stopped

  sandbox-controller:
    build:
      context: ./sandbox-controller
      dockerfile: Dockerfile
    ports:
      - "${SANDBOX_CONTROLLER_PORT:-18080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-net
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
