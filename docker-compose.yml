services:
  nginx:
    image: nginx:alpine@sha256:7e8ff0a32da368869608f285124b4375b901401d88f5027865d8f88984d35d38
    ports:
      - "${WEB_UI_PORT:-8080}:80"
    volumes:
      - ./webui:/usr/share/nginx/html:ro
    networks:
      - sandbox-net
    restart: unless-stopped

  sandbox-controller:
    build:
      context: ./sandbox-controller
      dockerfile: Dockerfile
    ports:
      - "${SANDBOX_CONTROLLER_PORT:-18080}:8080"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:18080,http://127.0.0.1:8080,http://127.0.0.1:18080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-net
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
