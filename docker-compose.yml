services:
  nginx:
    image: nginx:1.31-alpine@sha256:db35bfc6b2951e7f8a72db5db120288c127ffaeeb4a6d4b95a26fead017d5913
    ports:
      - "${WEB_UI_PORT:-8080}:80"
    volumes:
      - ./webui:/usr/share/nginx/html:ro
    networks:
      - sandbox-net
    restart: unless-stopped

  sandbox-runtime:
    build:
      context: ./sandbox-controller
      dockerfile: docker/Dockerfile
      target: runtime
    image: sandbox:runtime
    networks:
      - sandbox-net

  sandbox-controller:
    build:
      context: ./sandbox-controller
      dockerfile: Dockerfile
    ports:
      - "${SANDBOX_CONTROLLER_PORT:-18080}:8080"
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:18080,http://127.0.0.1:8080,http://127.0.0.1:18080}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-net
    restart: unless-stopped

networks:
  sandbox-net:
    driver: bridge
