[project]
name = "test-client"
version = "0.1.0"
description = "FastAPI test client for Docker Python sandbox"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.13",
    "pytest-cov>=6.0.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
