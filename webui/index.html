<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Python Sandbox</h1>
            <p class="subtitle">Execute Python code safely in an isolated environment</p>
        </header>

        <main>
            <div class="code-section">
                <label for="code">Python Code</label>
                <textarea id="code" placeholder="print('Hello, World!')"># Enter your Python code here
print('Hello, World!')

# Example: Calculate factorial
def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

print(f'5! = {factorial(5)}')</textarea>
            </div>

            <div class="controls">
                <div class="timeout-control">
                    <label for="timeout">Timeout (seconds)</label>
                    <input type="number" id="timeout" min="1" max="60" value="30">
                    <span class="range-info">1-60s</span>
                </div>

                <button id="run" class="run-btn">
                    <span class="btn-text">Run Code</span>
                    <span class="btn-spinner" hidden></span>
                </button>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <span>Output</span>
                    <button id="clear" class="clear-btn" hidden>Clear</button>
                </div>
                <pre id="output" class="output-empty">Output will appear here...</pre>
            </div>
        </main>

        <footer>
            <p>Powered by Docker-based sandbox controller</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
