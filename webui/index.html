<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Sandbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Python Sandbox</h1>
            <p class="subtitle">Execute Python code safely in an isolated environment</p>
        </header>

        <main>
            <div class="code-section">
                <label for="code">Python Code</label>
                <textarea id="code" placeholder="print('Hello, World!')">import time

# ── 1. Fibonacci ──────────────────────────
print("=== Fibonacci Sequence ===")
a, b = 0, 1
for i in range(8):
    print(f"  #{i+1:2d}: {a}")
    a, b = b, a + b
    time.sleep(0.05)

# ── 2. Prime Numbers ──────────────────────
print("\n=== Prime Number Search ===")
def is_prime(n):
    if n < 2: return False
    for i in range(2, int(n**0.5) + 1):
        if n % i == 0: return False
    return True

count, n = 0, 2
while count < 5:
    if is_prime(n):
        print(f"  Prime #{count+1:2d}: {n}")
        count += 1
    n += 1

# ── 3. Quick Demo ─────────────────────────
print("\n=== Quick Demo ===")
print("Hello from Docker Sandbox!")
print(f"3 + 5 = {3 + 5}")
print(f"2 ** 8 = {2 ** 8}")
print("Done!")</textarea>
            </div>

            <div class="controls">
                <div class="timeout-control">
                    <label for="timeout">Timeout (seconds)</label>
                    <input type="number" id="timeout" min="1" max="60" value="30">
                    <span class="range-info">1-60s</span>
                </div>

                <button id="run" class="run-btn">
                    <span class="btn-text">Run Code</span>
                    <span class="btn-spinner" hidden></span>
                </button>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <span>Output</span>
                    <button id="clear" class="clear-btn" hidden>Clear</button>
                </div>
                <pre id="output" class="output-empty">Output will appear here...</pre>
            </div>
        </main>

        <footer>
            <p>Powered by Docker-based sandbox controller</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
